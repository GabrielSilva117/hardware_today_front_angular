<!-- Basic Button -->
<button
  *ngIf="variant === 'basic'"
  mat-button
  [type]="type"
  [color]="color"
  [disabled]="disabled || loading"
  [class.full-width]="fullWidth"
  (click)="onClick()">
  <mat-icon *ngIf="icon && iconPosition === 'before' && !loading">{{ icon }}</mat-icon>
  <mat-spinner *ngIf="loading" diameter="20" class="button-spinner"></mat-spinner>
  <span>{{ label }}</span>
  <mat-icon *ngIf="icon && iconPosition === 'after' && !loading">{{ icon }}</mat-icon>
</button>
