<div *ngFor="let item of cart.items" class="cart-item">
  <img
    class="cart-item-image"
    [src]="item.product.image?.miniature || item.product.image?.gallery || fallbackImage"
    [alt]="item.product.image?.altText || item.product.name"
  />

  <div class="cart-item-info">
    <p class="cart-item-name">{{item.product.name}}</p>
    <small class="cart-item-category">{{ item.product.category.name }}</small>
    <small class="cart-item-price">R$ {{item.product.price}}</small>
  </div>

  <div class="cart-item-quantity">
    <button mat-icon-button (click)="removeProductFromCart(item.product.id, 1)">
      <mat-icon>remove</mat-icon>
    </button>
    <small>{{ item.quantity }}</small>
    <button mat-icon-button (click)="addProductToCart(item.product.id, 1)">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <button
    *ngIf="isActiveCart"
    mat-button="filled"
    class="cart-item-remove"
    (click)="removeProductFromCart(item.product.id, item.quantity ?? 1)"
  >
    Remove product
  </button>
</div>
